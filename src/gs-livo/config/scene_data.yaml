# scene_data.bag (Livox Avia + MVS camera rig, 2026-05-24). All FAST-LIVO2 sections are the config used for
# this rig: laptop /home/tianqi/src/article_code/src/FAST-LIVO2/config/avia.yaml (+ camera_pinhole.yaml ->
# camera_scene_data.yaml), except vio/exposure_estimate_en; the gs section is GS-LIVO's (config/avia.yaml).
common:
  img_topic: "/left_camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: true

extrin_calib:
  # --- 原始手调外参(保留备查,勿删) ---
  # extrinsic_T: [0.04165, 0.02326, -0.0284]
  # extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # --- FAST-LIO2 在线估计的雷达-IMU 外参(extrinsic_est_en, mat_out.txt 末200帧均值, R偏离单位阵1.11°) ---
  extrinsic_T: [-0.033622, 0.013623, -0.062342]
  extrinsic_R: [0.99987970, -0.00844268, -0.01301158,
                0.00828953,  0.99989626, -0.01177897,
                0.01310967,  0.01166970,  0.99984597]
  Rcl: [  0.000758, -0.999850, -0.017329,
        -0.001396,  0.017328, -0.999849,
        0.999999,  0.000782, -0.001383]
  Pcl: [  0.126360, -0.043904, -0.052206]

#  Rcl: [0.00610193,-0.999863,-0.0154172,
#        -0.00615449,0.0153796,-0.999863,
#        0.999962,0.00619598,-0.0060598]
#  Pcl: [0.0194384, 0.104689,-0.0251952]

time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.05
  lidar_type: 1 # Livox Avia LiDAR
  scan_line: 6
  blind: 0.6

vio:
  max_iterations: 10
  outlier_threshold: 100 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 50 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: true
  inverse_composition_en: false
  exposure_estimate_en: false  # GS-LIVO: the rendered map is the photometric reference (FAST-LIVO2 config: true)
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  b_acc_cov: 0.01 # was 0.0001 — too slow to track IMU bias
  b_gyr_cov: 0.01 # was 0.0001 — too slow to track IMU bias

lio:
  max_iterations: 10
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.005 # 0.005
  voxel_size: 0.3
  max_layer: 3
  max_points_num: 100
  layer_init_num: [10, 10, 10, 10, 10]

local_map:  
  map_sliding_en: true
  half_map_size: 50
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: true

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "scene_data"
  pose_output_en: false

pcd_save:
  pcd_save_en: false  # 离线重定位只需位姿,关 pcd 防 root 盘写满(原值 true,见注释)
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.02
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: false
  interval: 1

gs:
  # Global Gaussian map: hash-indexed octree (Sec. II-A). Paper: (0.06 m, 2 layers) indoor, (0.5 m, 2 layers) outdoor.
  root_voxel_size: 0.2      # CBD_Building_01: 0.06 m overflows the 100k window (see README)
  max_layer: 2
  leaf_capacity: 1          # Gaussians per leaf voxel
  # LiDAR-camera initialization (Sec. II-B.1, Eq. 2-3)
  scale_factor: 0.5         # tangential std-dev = scale_factor * leaf edge
  thickness: 0.002          # s_delta across the surface [m]
  init_opacity: 0.9
  min_depth: 0.3
  max_depth: 50.0
  # Sliding window + optimization (Sec. II-B.2, II-C); paper: 100k Gaussians, 10 iterations per frame
  max_window: 200000        # CBD_Building_01: 100k is full every frame (5.5% holes); 200k: +1 dB predicted PSNR, +4 ms
  iterations: 10
  lr_xyz: 0.0001
  lr_scale: 0.005
  lr_rot: 0.001
  lr_color: 0.005
  lr_opacity: 0.025
  max_scale_ratio: 3.0
  # Photometric IESKF update against the rendered map (Sec. II-D)
  visual_update_en: true
  meas_grid: 16             # one measurement point per 16x16 pixels
  min_alpha: 0.95
  render_every: 5           # refresh the rendered image / PSNR log every n frames
  save_ply: ""              # write the whole map as a 3DGS PLY on shutdown
